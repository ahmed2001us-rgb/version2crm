<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Rep CRM</title><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><style>
:root{--bg:#f5f7f8;--cd:#fff;--tx:#18222b;--mu:#6a7783;--bd:#e1e6ea;--pr:#0f766e;--rd:#c0392b;--am:#b7791f;--gr:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161a;--cd:#1a2128;--tx:#e6ebef;--mu:#8b98a4;--bd:#2a333b;--pr:#2bb5a8;--rd:#ef7766;--am:#e0b04f;--gr:#6fc276}}
:root[data-theme="dark"]{--bg:#11161a;--cd:#1a2128;--tx:#e6ebef;--mu:#8b98a4;--bd:#2a333b;--pr:#2bb5a8;--rd:#ef7766;--am:#e0b04f;--gr:#6fc276}
*{box-sizing:border-box}html,body{margin:0}body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:900px;margin:0 auto;padding:12px 12px 40px}h2{margin:2px 0;font-size:26px}h3{margin:18px 0 6px;font-size:15px}h4{margin:14px 0 4px;color:var(--pr)}
.mu,small{color:var(--mu)}small{display:block;font-size:12px}


.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px}.warn{border-color:var(--rd)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px}.bar i{display:block;height:100%;background:var(--pr);border-radius:3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin:5px 0;cursor:pointer}.r{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.b{font-size:11px;padding:2px 7px;border-radius:9px;border:1px solid var(--bd);white-space:nowrap}.A{color:var(--rd)}.B{color:var(--am)}.C{color:var(--gr)}.done{color:var(--gr)}.planned{color:var(--pr)}.missed,.bad{color:var(--rd);border-color:var(--rd)}
input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--cd)}label{display:block;margin:8px 0 0;font-size:12px;color:var(--mu)}
.btn,.sm{border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:10px 14px;cursor:pointer}.sm{padding:4px 8px;font-size:12px}.pr{background:var(--pr);color:#fff;border-color:var(--pr)}.dng{color:var(--rd)}
.bar2{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.bar2>*{flex:1;min-width:110px;width:auto}.bar2 .btn.on{background:var(--pr);color:#fff}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{display:inline-flex;gap:3px;align-items:center;margin:0;border:1px solid var(--bd);border-radius:8px;padding:6px 8px}.chip input{width:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal>div{background:var(--cd);border:1px solid var(--bd);border-radius:6px;min-height:50px;padding:4px;font-size:12px}.cal .h{min-height:0;border:0;background:none;color:var(--mu);text-align:center}.cal .today{border-color:var(--pr)}.cal .od{border-color:var(--rd)}.cal i{display:block;color:var(--pr);font-style:normal;font-weight:700}
#m{position:fixed;inset:0;background:#0007;z-index:9;display:flex;align-items:flex-end;justify-content:center}#m[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column;border-radius:14px 14px 0 0}.sheet header{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd)}.sheet header button{border:0;background:none;font-size:18px}
.sheet form{padding:4px 14px 14px;overflow:auto;flex:1}.foot{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}.foot .pr{margin-left:auto}
#t{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:6px 14px;border-radius:16px;font-size:13px;z-index:10;opacity:0;transition:.2s;pointer-events:none}#t.s{opacity:.9}
#top{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:0 auto;padding:10px 14px 0}#net{font-size:12px;padding:2px 9px;border-radius:10px;border:1px solid var(--bd)}#net.on{color:var(--gr)}#net.off{color:var(--am);border-color:var(--am)}.ok{color:var(--gr)}.bad{color:var(--rd);font-weight:700}
.tb{border-collapse:collapse;width:100%;font-size:13px}.tb th,.tb td{border-bottom:1px solid var(--bd);padding:6px;text-align:left;white-space:nowrap}.tb th{color:var(--mu);font-weight:600}textarea{margin-top:6px}.pt input[list]{min-width:170px}.pt input[type=time],.pt select{min-width:92px}.pt td{vertical-align:top}.tb th.sel{background:var(--pr);color:#fff}nav{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:86vw;background:var(--cd);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:7px;overflow-y:auto;padding:0 10px calc(14px + env(safe-area-inset-bottom,0px));z-index:20;transform:translateX(-100%);transition:transform .2s}
body.menu nav{transform:none}#ov{position:fixed;inset:0;background:#0006;z-index:15;display:none}body.menu #ov{display:block}
.badge{background:var(--rd);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px}
#menu{border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:5px 11px;font-size:18px;cursor:pointer}#top{gap:10px;justify-content:flex-start!important}#top b{flex:1}
.sec{background:var(--cd);border:1px solid var(--bd);border-radius:10px;margin:8px 0;padding:0 12px}.sec summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none}.sec summary::-webkit-details-marker{display:none}.sec summary::before{content:'▸  ';color:var(--mu)}.sec[open] summary::before{content:'▾  '}.sec[open]{padding-bottom:12px}
@media(min-width:900px){nav{transform:none}#ov,body.menu #ov{display:none}#menu{display:none}#top,#app{margin-left:290px;margin-right:0;max-width:none}#app{padding:16px 32px 40px}#top{padding:14px 32px 0}}
.hintbar{display:flex;justify-content:flex-end;margin-bottom:6px}.hintbtn{background:#f4c430;color:#3b2f00;border:0;border-radius:16px;padding:5px 13px;font-weight:600;cursor:pointer}.hintbox{background:#fff3c4;color:#4a3b00;border:1px solid #e0b43a;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hintbox{background:#3a3217;color:#f1dd8f;border-color:#6b5a1c}}:root[data-theme="dark"] .hintbox{background:#3a3217;color:#f1dd8f;border-color:#6b5a1c}
#rm{position:fixed;left:50%;transform:translateX(-50%);top:calc(60px + env(safe-area-inset-top,0px));width:min(560px,94vw);z-index:12}.rem{background:#fff3c4;color:#4a3b00;border:1px solid #e0b43a;border-radius:10px;padding:10px 12px;margin-bottom:6px;box-shadow:0 4px 14px #0004}.rem .sm{background:#fff;color:#222}
nav .brand{margin:0 -10px 4px;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 16px;background:linear-gradient(135deg,#0f766e,#17a897);color:#fff;border-bottom:3px solid #0a5a54;display:flex;align-items:center;gap:12px}
nav .brand i{font-style:normal;font-size:26px;background:#ffffff2b;border-radius:12px;width:46px;height:46px;display:grid;place-items:center;flex:0 0 46px}nav .brand b{display:block;font-size:21px;letter-spacing:.4px}nav .brand small{color:#ffffffd0;font-size:12px}
nav .grp{margin:10px 4px 0;padding-top:10px;border-top:1px solid var(--bd);font-size:11px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--mu)}nav .brand+.grp{border-top:0;margin-top:8px;padding-top:0}
nav button{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:11px 14px;font-size:14px;cursor:pointer;box-shadow:0 1px 2px #0001;transition:.15s}nav button:hover{border-color:var(--pr)}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr);box-shadow:0 3px 9px #0f766e66}
.fbar{margin-bottom:6px}.sx{display:flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:3px 10px;background:var(--cd);margin-bottom:6px}.sx select{flex:0 0 40%;border:0;background:none;color:var(--pr);font-weight:600;padding:8px 2px}.sx input{border:0;background:none;flex:1;padding:9px 2px;outline:none}
.chipx{display:inline-flex;gap:6px;align-items:center;background:var(--pr);color:#fff;border-radius:16px;padding:3px 5px 3px 12px;font-size:12px}.chipx button{border:0;background:#ffffff33;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer}nav .ver{margin-top:auto;padding:10px 6px 0;text-align:center;color:var(--mu);font-size:11px}
</style></head><body><div id="top"><button id="menu" data-a="menu" aria-label="Menu">☰</button><b>🩺 Rep CRM</b><span id="net"></span></div><div id="app"></div><nav id="nav"></nav><div id="ov" data-a="menu"></div><div id="rm"></div><div id="m" hidden></div><div id="t"></div><script src="vendor/dexie.min.js" onerror="void 0"></script><script src="shim.js"></script><script src="app.js"></script></body></html>
